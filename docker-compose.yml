services:
  db:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      # 5433, pas le 5432 par défaut : un autre projet local (projet-db-1) occupe déjà 5432 sur
      # cette machine. Sans incidence sur le backend, qui parle à `db:5432` via le réseau Docker
      # interne — ce mapping n'existe que pour un accès direct depuis l'hôte (ex. un client psql).
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc
    env_file: .env
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./infra/minio/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]

  # Pub/sub partagé entre instances backend pour la messagerie WebSocket (cahier des charges D.4,
  # docs/V2_FEATURES.md §3) — sans ça, deux utilisateurs connectés à deux instances backend
  # différentes ne se voient plus (voir ws/connection_manager.py). Aucun port publié : jamais
  # joignable hors du réseau compose, rien n'y étant stocké durablement qui justifierait un accès
  # direct depuis l'hôte (voir docs/DPIA.md) — `docker compose exec redis redis-cli` suffit pour
  # déboguer au besoin.
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    volumes:
      - ./backend:/app
    ports:
      - "8010:8000"
    # Chaque connexion WebSocket ouvre désormais son propre descripteur de fichier Redis en plus
    # de son propre socket (voir ws/connection_manager.py, P22) — 2 fds par connexion au lieu d'1
    # avec l'ancien registre en mémoire. Trouvé par un vrai test de charge, pas anticipé : au
    # défaut Docker (1024, souvent hérité de l'hôte), le backend s'est mis à refuser de nouvelles
    # connexions Redis ("Too many open files") aux alentours de 800 connexions WebSocket
    # simultanées sur une seule instance — bien avant toute limite réelle côté Redis (maxclients
    # 10000 par défaut, jamais approché) ou Postgres. 65536 donne une marge large sans autre
    # inconvénient qu'une table de descripteurs plus grande, jamais un coût mémoire ou CPU notable
    # au repos.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      # Sans ça, `docker compose up backend` (ou `run`) ne garantit pas que le bucket
      # bresonne-photos existe déjà — minio-init tourne en parallèle de backend, pas avant, tant
      # qu'on ne dépend que de `minio: service_healthy` (le serveur MinIO peut répondre en bonne
      # santé avant que minio-init ait fini de créer le bucket). Une course locale bénigne la
      # plupart du temps (minio-init est rapide), mais réelle en CI où pytest peut démarrer avant.
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Rappel quotidien de la question du jour en notification push (backend/scripts/push_scheduler.py).
  # Même image que `backend`, une simple boucle qui dort jusqu'à 18 h (Paris). Profil "push" en
  # dev (inutile sans PUSH_ENABLED=true et de vraies clés VAPID) ; toujours démarré en bêta/prod
  # (docker-compose.prod.yml retire le profil).
  push-scheduler:
    build: ./backend
    env_file: .env
    profiles: ["push"]
    command: ["python", "scripts/push_scheduler.py"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Boîte de réception de test (optionnelle, profil "mail") : attrape tous les emails envoyés en
  # SMTP par le backend sans jamais les délivrer à l'extérieur — pour vérifier le vrai chemin
  # d'envoi du code OTP en local (EMAIL_BACKEND=smtp, voir .env.example) sans compte Resend.
  # Gratuit, local ; interface web sur http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.20
    profiles: ["mail"]
    ports:
      - "127.0.0.1:8025:8025"

  adminer:
    image: adminer
    ports:
      - "8081:8080"
    depends_on:
      - db

  # Sauvegarde automatisée (dump Postgres + miroir des photos MinIO) et testée par restauration —
  # voir infra/backup/. Service long-vivant : sauvegarde immédiate puis en boucle toutes les
  # BACKUP_INTERVAL_SECONDS. Sauvegarde à la demande : `docker compose run --rm backup /scripts/backup.sh`.
  # Test de restauration : `docker compose run --rm backup /scripts/test_restore.sh`.
  backup:
    build: ./infra/backup
    env_file: .env
    environment:
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - backup_data:/backups
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Supervision basique (cahier des charges D.7/D.11/D.12 : Uptime Kuma, gratuit, auto-hébergé).
  # Premier démarrage : ouvrir http://localhost:8082, créer le compte admin, puis ajouter 3
  # moniteurs HTTP(S) — backend http://backend:8000/health, MinIO http://minio:9000/minio/health/live,
  # et un moniteur TCP sur db:5432 — avec une notification (email/webhook) sur passage en échec.
  uptime-kuma:
    image: louislam/uptime-kuma:1
    volumes:
      - uptime_kuma_data:/app/data
    ports:
      - "8082:3001"

  # Génération de la question du jour personnalisée (services/question_llm.py) — gratuit, local,
  # 100% optionnel : profil "ai", jamais démarré par défaut (les poids du modèle pèsent plusieurs
  # centaines de Mo à télécharger au premier démarrage, et le CI ne le lance jamais). Activer :
  # `docker compose --profile ai up -d ollama ollama-init` puis OLLAMA_ENABLED=true dans .env.
  # Sans ça, ou si le conteneur est indisponible/trop lent, services/question_llm.py retombe
  # silencieusement sur le gabarit statique — backend n'a donc aucun depends_on vers ollama.
  ollama:
    profiles: ["ai"]
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Télécharge le modèle une fois au démarrage (idempotent : `ollama pull` ne retélécharge rien
  # si le modèle est déjà dans le volume ollama_data) plutôt que de laisser la toute première
  # question du jour générée payer ce téléchargement dans le court timeout HTTP
  # (OLLAMA_TIMEOUT_SECONDS, voir core/config.py).
  ollama-init:
    profiles: ["ai"]
    image: ollama/ollama:latest
    env_file: .env
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "OLLAMA_HOST=ollama:11434 ollama pull ${OLLAMA_MODEL:-llama3.2:1b}"]

  # Flutter (Phase 6) — pas lancé par défaut : `docker compose --profile mobile up mobile`
  mobile:
    profiles: ["mobile"]
    build: ./mobile
    environment:
      # dev (défaut) : `flutter run -d web-server`, hot reload, mais suppose que la page est
      # chargée depuis la même origine que l'outil Flutter — casse silencieusement (page blanche)
      # si un·e testeur·se y accède via l'IP LAN plutôt que localhost. serve : build de
      # production statique, sans connexion de debug, ce qu'il faut pour un bêta-test réseau
      # local (voir README, "Bêta-test entre proches") — voir mobile/entrypoint.sh.
      MOBILE_MODE: ${MOBILE_MODE:-dev}
      # Origine complète du backend quand un tunnel (devtunnels, ngrok...) est utilisé — voir
      # mobile/entrypoint.sh et lib/api/api_config.dart. Vide par défaut (dérivation normale).
      API_BASE_URL: ${API_BASE_URL:-}
    volumes:
      - ./mobile:/app
    ports:
      - "5000:5000"

volumes:
  db_data:
  minio_data:
  backup_data:
  uptime_kuma_data:
  ollama_data:
